<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonChat - Selfie Cam Live Call</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0c0c0e; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
        
        header { margin-bottom: 10px; text-align: center; }
        header h1 { font-size: 22px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .badge { background: #ff0055; padding: 3px 8px; border-radius: 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }

        .app-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 10px; }
        
        .video-grid { display: flex; gap: 10px; width: 100%; justify-content: center; flex-wrap: wrap; }
        .video-box { position: relative; flex: 1; min-width: 280px; max-width: 440px; height: 300px; background: #16161e; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a3a; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        
        /* Remote partner video normal dikhega */
        video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.15s ease; }
        
        /* Local user video Selfie Camera ki tarah MIRROR HOGA */
        #localVideo { transform: scaleX(-1); }
        
        .user-tag { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.65); backdrop-filter: blur(5px); padding: 5px 12px; border-radius: 20px; font-size: 11px; border: 1px solid rgba(255,255,255,0.1); }

        .controls-card { background: #15151c; border-radius: 16px; padding: 12px; border: 1px solid #252533; display: flex; flex-direction: column; gap: 10px; }
        
        .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
        .filter-btn { background: #20202c; color: #bbb; border: 1px solid #323245; padding: 7px 12px; border-radius: 20px; font-size: 11px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .filter-btn.active, .filter-btn:hover { background: #00ffcc; color: #000; font-weight: bold; border-color: #00ffcc; }

        .action-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .match-select { background: #20202c; color: white; border: 1px solid #323245; padding: 10px 12px; border-radius: 10px; font-size: 12px; }
        
        .btn-next { flex: 1; background: linear-gradient(135deg, #00ffcc, #0099ff); color: #000; font-weight: bold; border: none; padding: 12px 16px; border-radius: 10px; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,204,0.3); }
        .btn-vip { background: linear-gradient(135deg, #ff007f, #7928ca); color: white; font-weight: bold; border: none; padding: 12px 14px; border-radius: 10px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>NEON CHAT <span class="badge">Selfie View</span></h1>
    </header>

    <div class="app-container">
        <div class="video-grid">
            <div class="video-box">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="user-tag">You (Selfie Cam)</div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="user-tag" id="partnerLabel">Searching Partner...</div>
            </div>
        </div>

        <div class="controls-card">
            <span style="font-size: 11px; color: #888; font-weight: bold; letter-spacing: 0.5px;">INSTAGRAM & TIKTOK FILTERS</span>
            <div class="filter-row">
                <button class="filter-btn active" onclick="applyFilter('none', this)">Normal</button>
                <button class="filter-btn" onclick="applyFilter('beauty', this)">✨ Beauty Glow</button>
                <button class="filter-btn" onclick="applyFilter('sunset', this)">🌇 Sunset Warm</button>
                <button class="filter-btn" onclick="applyFilter('cyber', this)">👾 Cyber Neon</button>
                <button class="filter-btn" onclick="applyFilter('vintage', this)">🎬 Vintage Retro</button>
                <button class="filter-btn" onclick="applyFilter('matrix', this)">💚 Matrix Code</button>
                <button class="filter-btn" onclick="applyFilter('pink', this)">🌸 Soft Pink</button>
                <button class="filter-btn" onclick="applyFilter('noir', this)">🖤 Moody Noir</button>
            </div>

            <div class="action-row">
                <select class="match-select" id="genderPref">
                    <option value="all">Match: Everyone</option>
                    <option value="female">Match: Girls (VIP 👑)</option>
                    <option value="male">Match: Guys (VIP 👑)</option>
                </select>
                <button class="btn-next" onclick="nextPartner()">Next ➔</button>
                <button class="btn-vip" onclick="openVipModal()">👑 VIP</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        
        let localStream;
        let peerConnection;
        let targetPeerId;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Front Camera Preferences (FacingMode: user)
        navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: { ideal: 640, max: 854 },
                height: { ideal: 480, max: 480 },
                frameRate: { ideal: 30, max: 60 }
            },
            audio: true
        }).then(stream => {
            localStream = stream;
            localVideo.srcObject = stream;
        }).catch(err => alert("Camera permission required!"));

        function createPeerConnection(peerId) {
            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
                document.getElementById('partnerLabel').innerText = "Live Connected 🟢";
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('signal', {
                        to: peerId,
                        signal: { candidate: event.candidate }
                    });
                }
            };
        }

        socket.on('match', async data => {
            targetPeerId = data.peerId;
            document.getElementById('partnerLabel').innerText = "Connecting Stream...";
            createPeerConnection(targetPeerId);

            if (data.initiator) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('signal', { to: targetPeerId, signal: { sdp: offer } });
            }
        });

        socket.on('signal', async data => {
            if (!peerConnection) createPeerConnection(data.from);

            if (data.signal.sdp) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                if (data.signal.sdp.type === 'offer') {
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('signal', { to: data.from, signal: { sdp: answer } });
                }
            } else if (data.signal.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
            }
        });

        // Fast Video Filters (Preserves Selfie Mirror View)
        function applyFilter(filterType, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            switch(filterType) {
                case 'beauty':
                    localVideo.style.filter = 'brightness(1.12) contrast(1.05) saturate(1.1)';
                    break;
                case 'sunset':
                    localVideo.style.filter = 'sepia(0.4) saturate(1.4) brightness(1.05)';
                    break;
                case 'cyber':
                    localVideo.style.filter = 'hue-rotate(190deg) saturate(1.6)';
                    break;
                case 'vintage':
                    localVideo.style.filter = 'sepia(0.25) contrast(1.2) brightness(0.95)';
                    break;
                case 'matrix':
                    localVideo.style.filter = 'hue-rotate(90deg) saturate(2) brightness(0.9)';
                    break;
                case 'pink':
                    localVideo.style.filter = 'hue-rotate(300deg) saturate(1.2) brightness(1.1)';
                    break;
                case 'noir':
                    localVideo.style.filter = 'grayscale(1) contrast(1.3)';
                    break;
                default:
                    localVideo.style.filter = 'none';
            }
        }

        function nextPartner() {
            const gender = document.getElementById('genderPref').value;
            if(gender !== 'all') {
                alert("👑 Gender Matching is a VIP Feature! Upgrade to unlock.");
                return;
            }
            location.reload();
        }

        function openVipModal() {
            alert("👑 VIP Subscription Pass:\n\n• Unlimited Girl/Boy Gender Filter\n• Zero Advertisements\n• VIP Badge on Profile\n\nPrice: ₹49/Month");
        }
    </script>
</body>
</html>
