<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonChat - Live Video & Text Chat</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0c0c0e; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .profile-card { background: #161622; border: 1px solid #00ffcc; padding: 20px; border-radius: 20px; width: 90%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 25px rgba(0,255,204,0.25); text-align: center; }
        .profile-card h2 { color: #00ffcc; font-size: 20px; }
        
        /* Instagram Style View Profile Modal */
        .view-card { background: #1a1a28; border: 1px solid #00ffcc; padding: 25px; border-radius: 24px; width: 85%; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 15px; box-shadow: 0 0 30px rgba(0,255,204,0.3); position: relative; animation: popUp 0.2s ease-out; }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .view-dp { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.4); }
        .view-name { font-size: 20px; font-weight: bold; color: #fff; }
        .view-details { font-size: 14px; color: #aaa; background: #222234; padding: 6px 14px; border-radius: 20px; border: 1px solid #33334d; }
        .btn-close-view { background: #00ffcc; color: #000; font-weight: bold; border: none; padding: 10px 24px; border-radius: 12px; font-size: 13px; cursor: pointer; width: 100%; }

        .avatar-upload-box { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 5px 0; }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #00ffcc; object-fit: cover; background: #222232; }
        .upload-btn-label { background: #222232; border: 1px dashed #00ffcc; color: #00ffcc; padding: 6px 12px; border-radius: 12px; font-size: 11px; cursor: pointer; }
        #dpFileInput { display: none; }

        .google-btn-box { display: flex; justify-content: center; }

        .input-group { display: flex; flex-direction: column; gap: 4px; text-align: left; }
        .input-group label { font-size: 11px; color: #aaa; }
        .input-group input, .input-group select { background: #222232; border: 1px solid #333348; color: white; padding: 9px; border-radius: 8px; outline: none; font-size: 13px; }
        .btn-start { background: linear-gradient(135deg, #00ffcc, #0099ff); color: #000; font-weight: bold; border: none; padding: 11px; border-radius: 10px; font-size: 14px; cursor: pointer; margin-top: 5px; }

        header { margin-bottom: 8px; text-align: center; }
        header h1 { font-size: 20px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .badge { background: #ff0055; padding: 2px 6px; border-radius: 10px; font-size: 10px; }

        .app-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 10px; }
        .video-grid { display: flex; gap: 10px; width: 100%; justify-content: center; flex-wrap: wrap; }
        .video-box { position: relative; flex: 1; min-width: 280px; max-width: 440px; height: 260px; background: #16161e; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a3a; }
        
        video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.15s ease; }
        #localVideo { transform: scaleX(-1); }
        
        /* Interactive Clickable Tag */
        .user-tag { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.75); backdrop-filter: blur(5px); padding: 5px 12px; border-radius: 20px; font-size: 11px; border: 1px solid rgba(255,255,255,0.15); z-index: 10; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: transform 0.1s ease; }
        .user-tag:active { transform: scale(0.95); }
        .tag-dp { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 1px solid #00ffcc; }

        .chat-card { background: #15151c; border-radius: 16px; padding: 10px; border: 1px solid #252533; height: 150px; display: flex; flex-direction: column; justify-content: space-between; }
        .chat-messages { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 5px; height: 100px; font-size: 12px; }
        .chat-msg { background: #222230; padding: 6px 10px; border-radius: 8px; width: fit-content; max-width: 85%; }
        .chat-msg span { font-weight: bold; color: #00ffcc; }
        .chat-input-row { display: flex; gap: 6px; }
        .chat-input { flex: 1; background: #20202c; border: 1px solid #323245; color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; outline: none; }
        .btn-send { background: #00ffcc; color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }

        .controls-card { background: #15151c; border-radius: 16px; padding: 10px; border: 1px solid #252533; display: flex; flex-direction: column; gap: 8px; }
        .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .filter-btn { background: #20202c; color: #bbb; border: 1px solid #323245; padding: 6px 10px; border-radius: 15px; font-size: 11px; white-space: nowrap; cursor: pointer; }
        .filter-btn.active { background: #00ffcc; color: #000; font-weight: bold; }

        .action-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .btn-next { flex: 1; background: linear-gradient(135deg, #00ffcc, #0099ff); color: #000; font-weight: bold; border: none; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .btn-logout { background: #ff0055; color: #fff; border: none; padding: 10px 14px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Instagram Profile View Pop-up Modal -->
    <div class="modal-overlay" id="viewProfileModal" style="display: none;">
        <div class="view-card">
            <img src="" id="viewDpImg" class="view-dp">
            <div class="view-name" id="viewNameText">User Profile</div>
            <div class="view-details" id="viewDetailsText">Age: -- | Country: --</div>
            <button class="btn-close-view" onclick="closeViewProfile()">Close Profile ✖</button>
        </div>
    </div>

    <!-- Login Setup Modal -->
    <div class="modal-overlay" id="profileModal">
        <div class="profile-card">
            <h2>Create Your Profile</h2>

            <div class="avatar-upload-box">
                <img src="https://via.placeholder.com/80/222232/00ffcc?text=DP" id="previewDP" class="avatar-preview">
                <label for="dpFileInput" class="upload-btn-label">📷 Upload Photo from Gallery</label>
                <input type="file" id="dpFileInput" accept="image/*" onchange="loadGalleryPhoto(event)">
            </div>

            <div class="google-btn-box">
                <div id="g_id_onload"
                    data-client_id="409779126550-8og63e04hvtu9d5k038mfjdnf1l8rhgg.apps.googleusercontent.com"
                    data-callback="handleCredentialResponse">
                </div>
                <div class="g_id_signin" data-type="standard" data-theme="filled_blue"></div>
            </div>

            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="usernameInput" placeholder="Enter name" value="User">
            </div>
            <div class="input-group">
                <label>Age</label>
                <input type="number" id="ageInput" placeholder="18+" value="21">
            </div>
            <div class="input-group">
                <label>Country</label>
                <select id="countryInput">
                    <option value="🇮🇳 India">🇮🇳 India</option>
                    <option value="🇺🇸 USA">🇺🇸 USA</option>
                    <option value="🇬🇧 UK">🇬🇧 UK</option>
                    <option value="🌍 Global">🌍 Global</option>
                </select>
            </div>
            <button class="btn-start" onclick="saveAndContinue()">Save & Start Matching 🚀</button>
        </div>
    </div>

    <header>
        <h1>NEON CHAT <span class="badge">Live Call</span></h1>
    </header>

    <div class="app-container">
        <div class="video-grid">
            <div class="video-box">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="user-tag" id="myTag" onclick="openMyProfile()"><img src="" class="tag-dp" id="myTagDp"><span>You</span></div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="user-tag" id="partnerLabel" onclick="openPartnerProfile()">Searching Partner...</div>
            </div>
        </div>

        <div class="chat-card">
            <div class="chat-messages" id="chatBox">
                <div class="chat-msg"><span>System:</span> Connected to Live Chat! Say hi 👋</div>
            </div>
            <div class="chat-input-row">
                <input type="text" class="chat-input" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div class="controls-card">
            <div class="filter-row">
                <button class="filter-btn active" onclick="applyFilter('none', this)">Normal</button>
                <button class="filter-btn" onclick="applyFilter('beauty', this)">✨ Beauty Glow</button>
                <button class="filter-btn" onclick="applyFilter('sunset', this)">🌇 Sunset</button>
                <button class="filter-btn" onclick="applyFilter('cyber', this)">👾 Cyber</button>
                <button class="filter-btn" onclick="applyFilter('pink', this)">🌸 Soft Pink</button>
            </div>

            <div class="action-row">
                <button class="btn-next" onclick="findNextPartner()">Next Partner ➔</button>
                <button class="btn-logout" onclick="logoutProfile()">Logout 🚪</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        
        let localStream;
        let peerConnection;
        let targetPeerId;
        let myProfile = { name: 'User', age: '21', country: '🇮🇳 India', dp: '' };
        let partnerProfileData = null;

        const rtcConfig = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ] 
        };

        window.onload = () => {
            const savedProfile = localStorage.getItem('neon_user_profile_v2');
            if (savedProfile) {
                myProfile = JSON.parse(savedProfile);
                applyProfileToUI();
                document.getElementById('profileModal').style.display = 'none';
                startCamera();
            }
        };

        function loadGalleryPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    myProfile.dp = e.target.result;
                    document.getElementById('previewDP').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function handleCredentialResponse(response) {
            const payload = parseJwt(response.credential);
            document.getElementById('usernameInput').value = payload.name;
            if (payload.picture && !myProfile.dp) {
                myProfile.dp = payload.picture;
                document.getElementById('previewDP').src = payload.picture;
            }
            alert(`✅ Google Account Verified: ${payload.name}`);
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
        }

        function saveAndContinue() {
            myProfile.name = document.getElementById('usernameInput').value || 'Guest';
            myProfile.age = document.getElementById('ageInput').value || '18';
            myProfile.country = document.getElementById('countryInput').value || '🌍 Global';
            if (!myProfile.dp) myProfile.dp = 'https://via.placeholder.com/80/00ffcc/000000?text=User';

            localStorage.setItem('neon_user_profile_v2', JSON.stringify(myProfile));

            applyProfileToUI();
            document.getElementById('profileModal').style.display = 'none';
            startCamera();
        }

        function applyProfileToUI() {
            document.getElementById('myTag').innerHTML = `<img src="${myProfile.dp}" class="tag-dp"> <span>${myProfile.name}, ${myProfile.age} (${myProfile.country})</span>`;
        }

        // Open Profile View Popup
        function openMyProfile() {
            showProfilePopup(myProfile.dp, myProfile.name, myProfile.age, myProfile.country);
        }

        function openPartnerProfile() {
            if (partnerProfileData) {
                showProfilePopup(partnerProfileData.dp, partnerProfileData.name, partnerProfileData.age, partnerProfileData.country);
            } else {
                alert("Partner connected nahi hai!");
            }
        }

        function showProfilePopup(dp, name, age, country) {
            document.getElementById('viewDpImg').src = dp || 'https://via.placeholder.com/100';
            document.getElementById('viewNameText').innerText = name || 'User';
            document.getElementById('viewDetailsText').innerText = `Age: ${age || '18'} | Country: ${country || 'Global'}`;
            document.getElementById('viewProfileModal').style.display = 'flex';
        }

        function closeViewProfile() {
            document.getElementById('viewProfileModal').style.display = 'none';
        }

        function logoutProfile() {
            if(confirm("Kya aap sach me logout karna chahte hain?")) {
                localStorage.removeItem('neon_user_profile_v2');
                location.reload();
            }
        }

        function startCamera() {
            if(localStream) return;
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                audio: true
            }).then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
            }).catch(err => alert("Camera permission required!"));
        }

        function createPeerConnection(peerId) {
            if (peerConnection) peerConnection.close();

            peerConnection = new RTCPeerConnection(rtcConfig);

            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('signal', { to: peerId, signal: { candidate: event.candidate } });
                }
            };
        }

        socket.on('match', async data => {
            targetPeerId = data.peerId;
            createPeerConnection(targetPeerId);

            socket.emit('signal', { to: targetPeerId, signal: { profile: myProfile } });

            if (data.initiator) {
                try {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    socket.emit('signal', { to: targetPeerId, signal: { sdp: offer } });
                } catch (e) { console.error(e); }
            }
        });

        socket.on('partner-disconnected', () => {
            partnerProfileData = null;
            document.getElementById('partnerLabel').innerText = "Partner Left. Reconnecting...";
            setTimeout(() => {
                location.reload();
            }, 800);
        });

        socket.on('signal', async data => {
            if (data.signal.profile) {
                partnerProfileData = data.signal.profile;
                document.getElementById('partnerLabel').innerHTML = `<img src="${partnerProfileData.dp || 'https://via.placeholder.com/80'}" class="tag-dp"> <span>🟢 ${partnerProfileData.name || 'User'}, ${partnerProfileData.age || '18'} (${partnerProfileData.country || ''})</span>`;
                return;
            }

            if (data.signal.chat) {
                appendMessage(data.signal.sender, data.signal.chat);
                return;
            }

            if (!peerConnection) {
                createPeerConnection(data.from);
            }

            if (data.signal.sdp) {
                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                    if (data.signal.sdp.type === 'offer') {
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        socket.emit('signal', { to: data.from, signal: { sdp: answer } });
                    }
                } catch(e) { console.error(e); }
            } else if (data.signal.candidate) {
                try {
                    if (peerConnection.remoteDescription) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
                    }
                } catch(e) {}
            }
        });

        function findNextPartner() {
            location.reload();
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !targetPeerId) return;

            appendMessage("You", text);
            socket.emit('signal', { to: targetPeerId, signal: { chat: text, sender: myProfile.name || 'You' } });
            input.value = '';
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<span>${sender}:</span> ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function applyFilter(filterType, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (filterType === 'beauty') localVideo.style.filter = 'brightness(1.15) contrast(1.05)';
            else if (
