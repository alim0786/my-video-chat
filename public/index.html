<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Video Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .video-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    video {
      width: 100%;
      max-width: 400px;
      height: 300px;
      background-color: #000;
      border-radius: 10px;
      object-fit: cover;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #00ffcc;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>NEON CHAT - Live Call</h1>
  
  <div class="video-container">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <button id="startBtn" onclick="startMatching()">Save & Start Matching 🚀</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let localStream;
    let peerConnection;
    let partnerId = null;

    // STUN + TURN Credentials (Metered Server Integrated)
    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        {
          urls: "turn:neonchat.metered.live:80",
          username: "af68e8eed57dfed3c3326f65",
          credential: "MsftfXoRHfM5nTwo"
        },
        {
          urls: "turn:neonchat.metered.live:443?transport=tcp",
          username: "af68e8eed57dfed3c3326f65",
          credential: "MsftfXoRHfM5nTwo"
        }
      ]
    };

    // Camera aur Mic access karna
    async function initMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (err) {
        alert("Camera and Microphone access required!");
        console.error(err);
      }
    }

    initMedia();

    function startMatching() {
      document.getElementById('startBtn').innerText = "Searching Partner...";
      socket.emit('find-partner');
    }

    socket.on('waiting', (msg) => {
      console.log(msg);
    });

    socket.on('partner-found', async (data) => {
      partnerId = data.partnerId;
      document.getElementById('startBtn').innerText = "Connected!";
      createPeerConnection();

      if (data.createOffer) {
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('offer', { target: partnerId, signal: offer });
      }
    });

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', { target: partnerId, candidate: event.candidate });
        }
      };
    }

    socket.on('offer', async (data) => {
      if (!peerConnection) createPeerConnection();
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('answer', { target: data.from, signal: answer });
    });

    socket.on('answer', async (data) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection && data.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {
          console.error("Error adding ice candidate", e);
        }
      }
    });

    socket.on('user-disconnected', () => {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('startBtn').innerText = "Start Matching 🚀";
      alert("Partner disconnected.");
    });
  </script>
</body>
</html>
