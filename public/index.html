<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonChat - HD Live Video Call</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0f12; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        
        header { margin-bottom: 12px; text-align: center; }
        header h1 { font-size: 22px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .badge { background: #ff0055; padding: 3px 8px; border-radius: 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }

        .app-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 12px; }
        
        .video-grid { display: flex; gap: 10px; width: 100%; justify-content: center; flex-wrap: wrap; }
        .video-box { position: relative; flex: 1; min-width: 280px; max-width: 440px; height: 300px; background: #1a1a24; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a3a; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.3s ease; }
        
        .user-tag { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(255,255,255,0.1); }

        .controls-card { background: #181820; border-radius: 16px; padding: 15px; border: 1px solid #282835; display: flex; flex-direction: column; gap: 12px; }
        
        .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .filter-btn { background: #252533; color: #ccc; border: 1px solid #38384a; padding: 8px 14px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .filter-btn.active, .filter-btn:hover { background: #00ffcc; color: #000; font-weight: bold; border-color: #00ffcc; }

        .action-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .match-select { background: #252533; color: white; border: 1px solid #38384a; padding: 10px 14px; border-radius: 10px; font-size: 13px; }
        
        .btn-next { flex: 1; background: linear-gradient(135deg, #00ffcc, #0099ff); color: #000; font-weight: bold; border: none; padding: 12px 20px; border-radius: 10px; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,204,0.3); }
        .btn-vip { background: linear-gradient(135deg, #ff007f, #7928ca); color: white; font-weight: bold; border: none; padding: 12px 16px; border-radius: 10px; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>NEON CHAT <span class="badge">HD Live</span></h1>
    </header>

    <div class="app-container">
        <div class="video-grid">
            <div class="video-box">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="user-tag">You (HD Sensor)</div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="user-tag" id="partnerLabel">Searching Partner...</div>
            </div>
        </div>

        <div class="controls-card">
            <span style="font-size: 12px; color: #888;">SELECT CAMERA FILTER</span>
            <div class="filter-row">
                <button class="filter-btn active" onclick="applyFilter('none', this)">Normal</button>
                <button class="filter-btn" onclick="applyFilter('beauty', this)">✨ Beauty Glow</button>
                <button class="filter-btn" onclick="applyFilter('warm', this)">🌅 Golden Hour</button>
                <button class="filter-btn" onclick="applyFilter('cyber', this)">🧪 Cyberpunk</button>
                <button class="filter-btn" onclick="applyFilter('bw', this)">🎬 Noir B&W</button>
            </div>

            <div class="action-row">
                <select class="match-select" id="genderPref">
                    <option value="all">Match: Everyone</option>
                    <option value="female">Match: Girls (VIP 👑)</option>
                    <option value="male">Match: Guys (VIP 👑)</option>
                </select>
                <button class="btn-next" onclick="nextPartner()">Next ➔</button>
                <button class="btn-vip" onclick="openVipModal()">👑 VIP</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        
        let localStream;
        let peerConnection;
        let targetPeerId;

        // Google Free STUN Server for WebRTC NAT Traversal
        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        // 1. Get User Media Camera Stream
        navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: true
        }).then(stream => {
            localStream = stream;
            localVideo.srcObject = stream;
        }).catch(err => alert("Camera permission is needed for live call!"));

        // 2. WebRTC Peer Connection Setup
        function createPeerConnection(peerId) {
            peerConnection = new RTCPeerConnection(rtcConfig);

            // Add local stream tracks to WebRTC
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            // Receive remote stream track
            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
                document.getElementById('partnerLabel').innerText = "Live Connected 🟢";
            };

            // ICE Candidate Exchange
            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('signal', {
                        to: peerId,
                        signal: { candidate: event.candidate }
                    });
                }
            };
        }

        // 3. Handle Socket Matching
        socket.on('match', async data => {
            targetPeerId = data.peerId;
            document.getElementById('partnerLabel').innerText = "Connecting Stream...";
            createPeerConnection(targetPeerId);

            if (data.initiator) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('signal', { to: targetPeerId, signal: { sdp: offer } });
            }
        });

        // 4. Handle WebRTC Signaling Protocol
        socket.on('signal', async data => {
            if (!peerConnection) createPeerConnection(data.from);

            if (data.signal.sdp) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                if (data.signal.sdp.type === 'offer') {
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('signal', { to: data.from, signal: { sdp: answer } });
                }
            } else if (data.signal.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
            }
        });

        // Live Filters Logic
        function applyFilter(filterType, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            switch(filterType) {
                case 'beauty':
                    localVideo.style.filter = 'brightness(1.15) contrast(1.05) saturate(1.1) blur(0.4px)';
                    break;
                case 'warm':
                    localVideo.style.filter = 'sepia(0.35) contrast(1.1) brightness(1.05)';
                    break;
                case 'cyber':
                    localVideo.style.filter = 'hue-rotate(180deg) saturate(1.8) contrast(1.2)';
                    break;
                case 'bw':
                    localVideo.style.filter = 'grayscale(1) contrast(1.2)';
                    break;
                default:
                    localVideo.style.filter = 'none';
            }
        }

        function nextPartner() {
            const gender = document.getElementById('genderPref').value;
            if(gender !== 'all') {
                alert("👑 Gender Matching is a VIP Feature! Upgrade to unlock.");
                return;
            }
            location.reload();
        }

        function openVipModal() {
            alert("👑 VIP Subscription Pass:\n\n• Unlimited Girl/Boy Gender Filter\n• Zero Advertisements\n• VIP Badge on Profile\n\nPrice: ₹49/Month");
        }
    </script>
</body>
</html>
