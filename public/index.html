<!DOCTYPE html>
<html>
<head>
    <title>Live Video Chat</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 20px; }
        .video-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        video { width: 45%; max-width: 400px; height: 250px; border-radius: 10px; background: #222; object-fit: cover; border: 2px solid #333; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <h2>Omegle Clone - Random Video Call</h2>
    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <br>
    <button onclick="location.reload()">Next User ➔</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');

        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localVideo.srcObject = stream;
            })
            .catch(err => alert("Camera permission is required!"));

        socket.on('match', data => {
            alert('User matched! Audio/Video connected.');
        });
    </script>
</body>
</html>
