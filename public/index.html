<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON CHAT - Live Call</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background-color: #0d0d13; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
    
    header h1 { font-size: 24px; color: #fff; margin: 10px 0; }
    header h1 span { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }

    /* Video Container */
    .chat-container { width: 100%; max-width: 800px; margin-top: 10px; }
    .video-grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
    .video-box { position: relative; width: 48%; min-width: 150px; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .video-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 12px; }

    /* Chat Section */
    .chat-box { background: #161622; border-radius: 8px; padding: 10px; height: 150px; overflow-y: auto; text-align: left; margin-bottom: 10px; font-size: 14px; }
    .chat-input-area { display: flex; gap: 8px; }
    .chat-input-area input { flex: 1; padding: 10px; background: #0d0d13; border: 1px solid #333; border-radius: 6px; color: #fff; }
    .btn-action { padding: 10px 16px; background: #333; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
    .btn-skip { background: #ff3366; }
  </style>
</head>
<body>

  <header>
    <h1>NEON CHAT <span>Live Call</span></h1>
  </header>

  <!-- Direct Chat & Video Layout -->
  <div class="chat-container">
    <div class="video-grid">
      <div class="video-box">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="video-label">You</div>
      </div>
      <div class="video-box">
        <video id="remoteVideo" autoplay playsinline></video>
        <div id="partnerStatus" class="video-label">Requesting Camera Access...</div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div><span style="color: #00ffcc;">System:</span> Connected to Live Chat! Say hi 👋</div>
    </div>

    <div class="chat-input-area">
      <button class="btn-action btn-skip" onclick="skipPartner()">Next ⏭</button>
      <input type="text" id="msgInput" placeholder="Type a message...">
      <button class="btn-action" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let localStream;
    let peerConnection;
    let partnerId = null;

    // Metered TURN Credentials Integrated
    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        {
          urls: "turn:neonchat.metered.live:80",
          username: "af68e8eed57dfed3c3326f65",
          credential: "MsftfXoRHfM5nTwo"
        },
        {
          urls: "turn:neonchat.metered.live:443?transport=tcp",
          username: "af68e8eed57dfed3c3326f65",
          credential: "MsftfXoRHfM5nTwo"
        }
      ]
    };

    // Page khulte hi direct Camera & Mic permission maango
    async function startAppDirectly() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('partnerStatus').innerText = "Searching Partner...";
        
        // Permission milne ke turant baad partner search karo
        socket.emit('find-partner');
      } catch (err) {
        document.getElementById('partnerStatus').innerText = "Camera Access Denied!";
        alert("Live video chat ke liye Camera aur Microphone permission dena zaroori hai.");
      }
    }

    // Auto-executes on Page Load
    window.onload = startAppDirectly;

    socket.on('partner-found', async (data) => {
      partnerId = data.partnerId;
      document.getElementById('partnerStatus').innerText = "Connected 🟢";
      
      createPeerConnection();

      if (data.createOffer) {
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('offer', { target: partnerId, signal: offer });
      }
    });

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', { target: partnerId, candidate: event.candidate });
        }
      };
    }

    socket.on('offer', async (data) => {
      if (!peerConnection) createPeerConnection();
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('answer', { target: data.from, signal: answer });
    });

    socket.on('answer', async (data) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection && data.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) { console.error(e); }
      }
    });

    function sendMessage() {
      const msg = document.getElementById('msgInput').value;
      if (msg && partnerId) {
        socket.emit('send-message', { target: partnerId, text: msg });
        appendMsg(`You: ${msg}`);
        document.getElementById('msgInput').value = '';
      }
    }

    socket.on('receive-message', (data) => {
      appendMsg(`Partner: ${data.text}`);
    });

    function appendMsg(msg) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.innerText = msg;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function skipPartner() {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('partnerStatus').innerText = "Searching Partner...";
      socket.emit('skip-partner', { target: partnerId });
    }

    socket.on('partner-disconnected', () => {
      skipPartner();
    });
  </script>
</body>
</html>
