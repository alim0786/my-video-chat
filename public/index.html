<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonChat - Google Auth & Live Video</title>
    <!-- Google Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0c0c0e; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .profile-card { background: #161622; border: 1px solid #00ffcc; padding: 25px; border-radius: 20px; width: 90%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 20px rgba(0,255,204,0.2); }
        .profile-card h2 { color: #00ffcc; text-align: center; font-size: 20px; }
        
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 12px; color: #aaa; }
        .input-group input, .input-group select { background: #222232; border: 1px solid #333348; color: white; padding: 10px; border-radius: 8px; outline: none; font-size: 14px; }
        
        .google-btn-container { display: flex; justify-content: center; margin: 5px 0; }
        .btn-start { background: linear-gradient(135deg, #00ffcc, #0099ff); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 10px; font-size: 15px; cursor: pointer; }

        header { margin-bottom: 8px; text-align: center; }
        header h1 { font-size: 20px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .badge { background: #ff0055; padding: 2px 6px; border-radius: 10px; font-size: 10px; }

        .app-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 10px; }
        .video-grid { display: flex; gap: 10px; width: 100%; justify-content: center; flex-wrap: wrap; }
        .video-box { position: relative; flex: 1; min-width: 280px; max-width: 440px; height: 260px; background: #16161e; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a3a; }
        
        video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.15s ease; }
        #localVideo { transform: scaleX(-1); }
        
        .user-tag { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); padding: 4px 10px; border-radius: 15px; font-size: 11px; border: 1px solid rgba(255,255,255,0.1); z-index: 10; }

        .chat-card { background: #15151c; border-radius: 16px; padding: 10px; border: 1px solid #252533; height: 150px; display: flex; flex-direction: column; justify-content: space-between; }
        .chat-messages { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 5px; height: 100px; font-size: 12px; }
        .chat-msg { background: #222230; padding: 6px 10px; border-radius: 8px; width: fit-content; max-width: 85%; }
        .chat-msg span { font-weight: bold; color: #00ffcc; }
        .chat-input-row { display: flex; gap: 6px; }
        .chat-input { flex: 1; background: #20202c; border: 1px solid #323245; color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; outline: none; }
        .btn-send { background: #00ffcc; color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }

        .controls-card { background: #15151c; border-radius: 16px; padding: 10px; border: 1px solid #252533; display: flex; flex-direction: column; gap: 8px; }
        .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .filter-btn { background: #20202c; color: #bbb; border: 1px solid #323245; padding: 6px 10px; border-radius: 15px; font-size: 11px; white-space: nowrap; cursor: pointer; }
        .filter-btn.active { background: #00ffcc; color: #000; font-weight: bold; }

        .action-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .btn-next { flex: 1; background: linear-gradient(135deg, #00ffcc, #0099ff); color: #000; font-weight: bold; border: none; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .btn-reset { background: #333348; color: #aaa; border: none; padding: 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Saved / Google Auth Profile Overlay -->
    <div class="modal-overlay" id="profileModal">
        <div class="profile-card">
            <h2>Login to NeonChat</h2>
            
            <div class="google-btn-container">
                <!-- Google One-Tap Login Button -->
                <div id="g_id_onload"
                    data-client_id="YOUR_GOOGLE_CLIENT_ID"
                    data-callback="handleGoogleLogin">
                </div>
                <div class="g_id_signin" data-type="standard"></div>
            </div>

            <p style="text-align: center; font-size: 11px; color: #777;">— OR ENTER DETAILS —</p>

            <div class="input-group">
                <label>Your Name / Username</label>
                <input type="text" id="usernameInput" placeholder="e.g. Alex">
            </div>
            <div class="input-group">
                <label>Age</label>
                <input type="number" id="ageInput" placeholder="18+" value="21">
            </div>
            <div class="input-group">
                <label>Country</label>
                <select id="countryInput">
                    <option value="🇮🇳 India">🇮🇳 India</option>
                    <option value="🇺🇸 USA">🇺🇸 USA</option>
                    <option value="🇬🇧 UK">🇬🇧 UK</option>
                    <option value="🇨🇦 Canada">🇨🇦 Canada</option>
                    <option value="🌍 Global">🌍 Other / Global</option>
                </select>
            </div>
            <button class="btn-start" onclick="saveAndContinue()">Save & Start Match 🚀</button>
        </div>
    </div>

    <header>
        <h1>NEON CHAT <span class="badge">Live</span></h1>
    </header>

    <div class="app-container">
        <div class="video-grid">
            <div class="video-box">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="user-tag" id="myTag">You</div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="user-tag" id="partnerLabel">Searching Partner...</div>
            </div>
        </div>

        <div class="chat-card">
            <div class="chat-messages" id="chatBox">
                <div class="chat-msg"><span>System:</span> Welcome to Live Chat! Say hi 👋</div>
            </div>
            <div class="chat-input-row">
                <input type="text" class="chat-input" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div class="controls-card">
            <div class="filter-row">
                <button class="filter-btn active" onclick="applyFilter('none', this)">Normal</button>
                <button class="filter-btn" onclick="applyFilter('beauty', this)">✨ Beauty Glow</button>
                <button class="filter-btn" onclick="applyFilter('sunset', this)">🌇 Sunset</button>
                <button class="filter-btn" onclick="applyFilter('cyber', this)">👾 Cyber</button>
                <button class="filter-btn" onclick="applyFilter('pink', this)">🌸 Soft Pink</button>
            </div>

            <div class="action-row">
                <button class="btn-next" onclick="location.reload()">Next Partner ➔</button>
                <button class="btn-reset" onclick="resetProfile()">Edit Profile ⚙️</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        
        let localStream;
        let peerConnection;
        let targetPeerId;
        let myProfile = {};

        const rtcConfig = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ] 
        };

        // AUTO-LOAD SAVED PROFILE ON PAGE LOAD
        window.onload = () => {
            const savedProfile = localStorage.getItem('neon_user_profile');
            if (savedProfile) {
                myProfile = JSON.parse(savedProfile);
                document.getElementById('myTag').innerText = `${myProfile.name}, ${myProfile.age} (${myProfile.country})`;
                document.getElementById('profileModal').style.display = 'none';
                startCamera();
            }
        };

        // Google JWT Decoder
        function handleGoogleLogin(response) {
            const responsePayload = parseJwt(response.credential);
            document.getElementById('usernameInput').value = responsePayload.name;
            alert(`Logged in as ${responsePayload.name}! Now select Age & Country.`);
        }

        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function saveAndContinue() {
            const name = document.getElementById('usernameInput').value || 'Guest';
            const age = document.getElementById('ageInput').value || '18';
            const country = document.getElementById('countryInput').value || '🌍 Global';

            myProfile = { name, age, country };
            
            // Save permanently in browser Local Storage
            localStorage.setItem('neon_user_profile', JSON.stringify(myProfile));

            document.getElementById('myTag').innerText = `${name}, ${age} (${country})`;
            document.getElementById('profileModal').style.display = 'none';

            startCamera();
        }

        function resetProfile() {
            localStorage.removeItem('neon_user_profile');
            location.reload();
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                audio: true
            }).then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
            }).catch(err => alert("Camera permission required!"));
        }

        function createPeerConnection(peerId) {
            if (peerConnection) peerConnection.close();

            peerConnection = new RTCPeerConnection(rtcConfig);

            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('signal', { to: peerId, signal: { candidate: event.candidate } });
                }
            };
        }

        socket.on('match', async data => {
            targetPeerId = data.peerId;
            createPeerConnection(targetPeerId);

            socket.emit('signal', { to: targetPeerId, signal: { profile: myProfile } });

            if (data.initiator) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('signal', { to: targetPeerId, signal: { sdp: offer } });
            }
        });

        socket.on('partner-disconnected', () => {
            if (peerConnection) peerConnection.close();
            remoteVideo.srcObject = null;
            document.getElementById('partnerLabel').innerText = "Partner Left. Searching new partner...";
            appendMessage("System", "Partner disconnected.");
            
            setTimeout(() => {
                location.reload();
            }, 1200);
        });

        socket.on('signal', async data => {
            if (data.signal.profile) {
                const p = data.signal.profile;
                document.getElementById('partnerLabel').innerText = `🟢 ${p.name || 'User'}, ${p.age || '18'} (${p.country || ''})`;
                return;
            }

            if (data.signal.chat) {
                appendMessage(data.signal.sender, data.signal.chat);
                return;
            }

            createPeerConnection(data.from);

            if (data.signal.sdp) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                if (data.signal.sdp.type === 'offer') {
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('signal', { to: data.from, signal: { sdp: answer } });
                }
            } else if (data.signal.candidate) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
                } catch(e) {}
            }
        });

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !targetPeerId) return;

            appendMessage("You", text);
            socket.emit('signal', { to: targetPeerId, signal: { chat: text, sender: myProfile.name || 'You' } });
            input.value = '';
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<span>${sender}:</span> ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function applyFilter(filterType, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (filterType === 'beauty') localVideo.style.filter = 'brightness(1.15) contrast(1.05)';
            else if (filterType === 'sunset') localVideo.style.filter = 'sepia(0.4) saturate(1.4)';
            else if (filterType === 'cyber') localVideo.style.filter = 'hue-rotate(190deg) saturate(1.6)';
            else if (filterType === 'pink') localVideo.style.filter = 'hue-rotate(300deg) saturate(1.2)';
            else localVideo.style.filter = 'none';
        }
    </script>
</body>
</html>
